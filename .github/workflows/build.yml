name: Build KCAL Kernel Boot Image

on:
  push:
    branches: [ focal, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            fakeroot flex git kmod libelf-dev libssl-dev libtinfo5 lz4 python2 python3 sudo unzip wget \
            xz-utils pahole libbpf-dev
          sudo ln -sf /usr/bin/python2 /usr/bin/python

      - name: Build boot image
        run: |
          chmod +x build.sh include-recovery-in-userdata.sh
          ./build.sh

      - name: Upload boot.img artifact
        uses: actions/upload-artifact@v4
        with:
          name: miatoll-kcal-boot
          path: out/boot.img
